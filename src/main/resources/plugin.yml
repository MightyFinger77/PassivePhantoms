name: PassivePhantoms
version: '1.3.0-Dev2a'
main: PassivePhantoms
api-version: 1.13
description: Makes phantoms passive until they are attacked by a player or projectile. Features per-chunk mobcap and movement improvements to prevent phantoms from getting stuck.
authors: [MightyFinger77]
# Note: Movement improvements are experimental and phantoms may still get hung up on chorus trees.

commands:
  passivephantoms:
    description: PassivePhantoms admin commands
    usage: /<command> [reload|debug|status|list|update]

permissions:
  passivephantoms.reload:
    description: Allows reloading the PassivePhantoms configuration
    default: op
  passivephantoms.notify:
    description: Receive update notification on join when a new version is available
    default: op
  passivephantoms.update:
    description: Allows manually checking for plugin updates via /passivephantoms update
    default: op
folia-supported: true

